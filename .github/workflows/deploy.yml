name: Deploy ke VPS Piskola

on:
  push:
    branches:
      - piskola

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: SSH ke VPS dan git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/piskola
            git pull origin piskola
            # Restart server Node.js agar kode terbaru aktif
            pm2 restart piskola-tts 2>/dev/null || pm2 restart all 2>/dev/null || true
            echo "Deploy selesai: $(date)"
